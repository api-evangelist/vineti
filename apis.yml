aid: vineti
name: Vineti
description: 'Vineti was an enterprise software company for cell and gene therapy supply
  chain management, headquartered in San Francisco and founded in 2016. Its Personalized
  Therapy Management (PTM) platform — sold as PTM Enterprise and PTM Essentials —
  orchestrated the patient-centric supply chain behind autologous and allogeneic cell
  therapies, gene therapies and personalized cancer vaccines: chain of identity, chain
  of custody, apheresis and manufacturing scheduling, clinical-site workflows, and
  regulatory reporting. PTM was delivered as a configurable aPaaS on AWS, with HIPAA
  compliance certified by Avertium and GAMP-aligned validation. Vineti was named a
  World Economic Forum Technology Pioneer and raised a $35M Series C in 2020. The PTM
  software was acquired by Johnson & Johnson in 2023 to continue supporting its
  commercial therapy rollouts and clinical trials, and Vineti ceased to operate as an
  independent company: vineti.com no longer resolves and the domain now sits on
  Johnson & Johnson name servers. This profile is retained as a historical record —
  there is no live API surface to catalog.'
